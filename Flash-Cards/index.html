<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Multiplication Flash Cards</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1d2939;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px}.app{width:min(100%,390px);background:white;border-radius:24px;padding:24px;box-shadow:0 12px 40px #172b4d16}h1{text-align:center;font-size:1.25rem;margin:0 0 14px}.score{text-align:center;color:#475467;font-weight:650}.meter{height:20px;background:#e9eef7;border-radius:999px;overflow:hidden;margin-top:10px;border:1px solid #d0d5dd}.meter-fill{height:100%;width:0;background:linear-gradient(90deg,#34b77b,#12a66a);border-radius:999px;transition:width .35s ease}.goal{text-align:center;color:#667085;font-size:.78rem;margin-top:5px}.finished{display:none;text-align:center;padding:30px 0 14px}.finished h2{font-size:2rem;margin:10px 0}.finished p{font-size:1.25rem;color:#475467}.restart{background:#175cd3;color:#fff;padding:0 26px;font-size:1.1rem;margin-top:14px}.app.done .game{display:none}.app.done .finished{display:block}.confetti{position:fixed;top:-30px;width:10px;height:16px;pointer-events:none;z-index:10;animation:fall var(--duration) linear forwards;left:var(--left);background:var(--color);transform:rotate(var(--rotation))}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(900deg);opacity:0}}@media(prefers-reduced-motion:reduce){.confetti{animation:none;display:none}.meter-fill{transition:none}}.score strong{color:#175cd3}.problem{text-align:center;font-size:clamp(3rem,14vw,4.5rem);font-weight:800;letter-spacing:-.06em;margin:24px 0 12px}.answer{height:72px;border:2px solid #d0d5dd;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:700;font-variant-numeric:tabular-nums}.answer.empty{color:#98a2b3}.feedback{height:32px;text-align:center;margin-top:10px;font-weight:700}.feedback.correct{color:#067647}.feedback.wrong{color:#b42318}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;border-radius:13px;min-height:64px;background:#e9eef7;color:#182230;font-size:1.6rem;font-weight:700}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #84caff;outline-offset:2px}.clear{background:#fee4e2;color:#b42318}.enter{background:#175cd3;color:white;font-size:1.15rem}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:17px;gap:10px}.reset{font-size:.9rem;background:transparent;color:#667085;min-height:38px;padding:0 8px}.hint{font-size:.78rem;color:#98a2b3;text-align:right}.feedback:empty:before{content:'\00a0'}
/* Compact phone layout: keep the keypad within the viewport. */
body{padding:8px;overscroll-behavior:none}.app{padding:14px 18px;border-radius:18px}h1{font-size:1.12rem;margin-bottom:8px}.meter{height:16px;margin-top:6px}.goal{margin-top:3px}.problem{font-size:clamp(2.7rem,12vw,4rem);margin:12px 0 7px}.answer{height:56px;font-size:2.15rem}.feedback{height:25px;margin-top:5px}.keys{gap:7px;margin-top:5px}.keys button{min-height:clamp(43px,7.2dvh,57px);border-radius:10px;touch-action:manipulation}.footer{margin-top:8px}.reset{min-height:30px}.hint{font-size:.72rem}
@media(max-height:680px){body{padding:4px}.app{padding:10px 15px}h1{margin-bottom:5px}.problem{margin:7px 0 4px}.answer{height:48px}.feedback{height:22px;margin-top:3px}.keys{gap:5px}.keys button{min-height:clamp(38px,6.7dvh,48px)}.footer{margin-top:4px}.goal{font-size:.7rem}}

/* Responsive single-screen layout: keypad takes available vertical space. */
html,body{height:100%;overflow:hidden}
body{height:100dvh;min-height:0;padding:clamp(4px,1.2dvh,12px);display:flex;align-items:center;justify-content:center;overscroll-behavior:none}
.app{height:100%;max-height:850px;min-height:0;display:flex;flex-direction:column;padding:clamp(9px,1.7dvh,18px);overflow:hidden}
.app h1{flex:none;margin-bottom:clamp(3px,1dvh,10px)}
.game{flex:1;min-height:0;display:flex;flex-direction:column}
.score,.meter,.goal,.answer,.feedback,.footer{flex-shrink:0}
.problem{flex:1;min-height:0;margin:0;display:flex;align-items:center;justify-content:center;font-size:clamp(2rem, min(12vw, 8dvh), 4.5rem)}
.answer{height:clamp(36px,8dvh,70px)}
.feedback{height:clamp(19px,3.5dvh,30px);margin-top:2px}
.keys{flex:3.5;min-height:0;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(3px,1dvh,10px);margin-top:2px}
.keys button{min-height:0;height:100%;font-size:clamp(1.15rem,3.4dvh,1.7rem);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.keys .enter{font-size:clamp(.85rem,2.5dvh,1.15rem)}
.footer{margin-top:clamp(2px,.7dvh,9px)}
.reset{min-height:clamp(24px,4dvh,38px)}
.finished{margin:auto 0}
@media(max-height:520px){.app h1{font-size:1rem}.goal{font-size:.65rem}.meter{height:11px;margin-top:3px}.problem{font-size:clamp(1.6rem,7dvh,3rem)}.hint{display:none}.feedback{font-size:.85rem}}
@media(orientation:landscape) and (max-height:500px){.app{max-width:560px}.keys{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,minmax(0,1fr));flex:2}.problem{flex:.7}.answer{height:32px}.feedback{height:18px}}
</style>
</head>
<body><main class="app"><h1>✖ Multiplication Practice</h1><div class="game"><div class="score"><strong id="correct">0</strong> correct / <span id="attempted">0</span> attempted</div><div class="meter" role="progressbar" aria-label="Correct answers toward 15" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0" id="meter"><div class="meter-fill" id="meterFill"></div></div><div class="goal">Goal: 15 correct answers</div><div class="problem" id="problem" aria-live="polite"></div><div class="answer empty" id="answer" aria-label="Your answer">?</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="keys" id="keys"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="clear" data-key="clear" aria-label="Backspace">⌫</button><button data-key="0">0</button><button class="enter" data-key="enter">Enter ↵</button></div><div class="footer"><button class="reset" id="reset">Reset score</button><span class="hint">Keyboard works too</span></div></div><section class="finished" aria-live="polite"><div style="font-size:3.8rem">🎉🏆🎉</div><h2>Great job!</h2><p id="finalScore"></p><button class="restart" id="restart">Play again</button></section></main>
<script>
(()=>{'use strict';
const facts=Array.from({length:144},(_,i)=>[Math.floor(i/12)+1,i%12+1]);
const $=id=>document.getElementById(id);
let recent=[],current=null,input='',correct=0,attempted=0,locked=false,nextTimer=null,done=false;
function draw(){ $('correct').textContent=correct;$('attempted').textContent=attempted;$('meterFill').style.width=(correct/15*100)+'%';$('meter').setAttribute('aria-valuenow',correct);$('problem').textContent=`${current[0]} × ${current[1]}`;$('answer').textContent=input||'?';$('answer').classList.toggle('empty',!input); }
function next(){const available=facts.filter(([a,b])=>!recent.includes(`${a},${b}`));current=available[Math.floor(Math.random()*available.length)];recent.push(current.join(','));if(recent.length>10)recent.shift();input='';locked=false;$('feedback').textContent='';$('feedback').className='feedback';draw();}
function celebrate(){done=true;$('finalScore').textContent=`${correct} correct / ${attempted} attempted`;document.querySelector('.app').classList.add('done');const colors=['#f59e0b','#175cd3','#12a66a','#ed4b82','#8b5cf6'];for(let i=0;i<90;i++){const el=document.createElement('i');el.className='confetti';el.style.setProperty('--left',Math.random()*100+'vw');el.style.setProperty('--color',colors[i%colors.length]);el.style.setProperty('--duration',(2.5+Math.random()*2)+'s');el.style.setProperty('--rotation',Math.random()*360+'deg');el.style.setProperty('--drift',(Math.random()*220-110)+'px');document.body.append(el);setTimeout(()=>el.remove(),4700);}}
function press(key){if(locked||done)return;if(/^\d$/.test(key)){if(input.length<3)input+=key;draw();}else if(key==='clear'){input=input.slice(0,-1);draw();}else if(key==='enter'&&input!==''){attempted++;const ok=Number(input)===current[0]*current[1];if(ok)correct++;locked=true;$('feedback').textContent=ok?'✓ Correct!':`✗ Answer: ${current[0]*current[1]}`;$('feedback').className='feedback '+(ok?'correct':'wrong');draw();nextTimer=setTimeout(()=>{nextTimer=null;if(correct>=15)celebrate();else next();},ok?650:1500);}}
$('keys').addEventListener('click',e=>{const button=e.target.closest('button[data-key]');if(button)press(button.dataset.key);});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;let key=/^\d$/.test(e.key)?e.key:e.key==='Enter'?'enter':e.key==='Backspace'?'clear':null;if(key){e.preventDefault();press(key);}});
function restart(){if(nextTimer)clearTimeout(nextTimer);nextTimer=null;recent=[];correct=attempted=0;done=false;document.querySelector('.app').classList.remove('done');document.querySelectorAll('.confetti').forEach(el=>el.remove());next();}$('reset').addEventListener('click',restart);$('restart').addEventListener('click',restart);next();
})();
</script></body></html>
